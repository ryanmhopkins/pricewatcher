<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090a0c">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Change Feed — PlanSentry</title>
<link rel="icon" href="/icon.svg">
<link rel="stylesheet" href="/marketing.css?v=2">
<link rel="stylesheet" href="/changes.css?v=1">
<link rel="stylesheet" href="/product-footer.css?v=1">
</head>
<body>
<div class="wrap">
<header class="site-header">
<a class="logo" href="/">
<span>↗</span>PlanSentry</a>
<nav class="nav">
<a href="/app">Dashboard</a>
<a class="active" href="/changes.html">Change feed</a>
<a href="/account.html">Account</a>
</nav>
</header>
<main class="changes-page">
<section class="changes-hero">
<div class="eyebrow">Pricing intelligence</div>
<h1>Change feed</h1>
<p class="lead">Review detected pricing changes across every monitored competitor from one place.</p>
<div id="changes-msg" class="changes-msg">Loading…</div>
</section>
<section id="changes-content" hidden>
<div id="change-metrics" class="change-metrics">
</div>
<div class="feed-toolbar">
<input id="change-search" type="search" placeholder="Search competitors or changes">
<select id="severity-filter">
<option value="all">All severity</option>
<option value="high">High</option>
<option value="medium">Medium</option>
<option value="low">Low</option>
</select>
<select id="review-filter">
<option value="all">All review states</option>
<option value="unreviewed">Unreviewed</option>
<option value="reviewed">Reviewed</option>
</select>
<select id="change-sort">
<option value="newest">Newest first</option>
<option value="oldest">Oldest first</option>
</select>
</div>
<div id="change-list" class="change-list">
</div>
</section>
</main>
</div>
<footer class="product-footer"><span>© 2026 PlanSentry</span><a href="/status.html">Status</a><a href="/contact.html">Contact</a><a href="/privacy.html">Privacy</a><a href="/terms.html">Terms</a></footer>
<script src="/changes.js?v=2">
</script>
</body>
</html>
